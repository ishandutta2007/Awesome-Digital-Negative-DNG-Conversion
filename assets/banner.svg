<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.75; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes waveLine {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 180px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 220px;
    }
    .pill-group {
      animation: floatPill 5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 10, 8;
      animation: waveLine 15s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="220" cy="190" r="130" fill="#38bdf8" />
    <circle class="orb-2" cx="980" cy="210" r="140" fill="#a855f7" />
    <circle cx="600" cy="90" r="100" fill="#6366f1" opacity="0.25" />
  </g>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Flowing Dynamic Animated Pipeline Lines -->
  <path class="flow-line" d="M 60 210 Q 300 130, 600 210 T 1140 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" />
  <path class="flow-line" d="M 60 240 Q 300 320, 600 240 T 1140 240" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" />

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Badge / Category Header -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text y="5" fill="#38bdf8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="2">📸 CURATED KNOWLEDGE BASE</text>
  </g>

  <!-- Main Hero Title (Foreground) -->
  <text class="title-text" x="600" y="160" text-anchor="middle" font-size="44" fill="url(#accentGrad)" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.6))">
    Digital Negative (DNG) Conversion
  </text>

  <!-- Subtitle (Foreground) -->
  <text class="sub-text" x="600" y="205" text-anchor="middle" font-size="18" fill="#cbd5e1" letter-spacing="0.3">
    RAW Processing Engines • Universal Digital Archival • Open-Source Decoders &amp; SaaS Workflows
  </text>

  <!-- Floating Feature Badges / Metadata Cards -->
  <g class="pill-group" transform="translate(600, 275)" text-anchor="middle">
    <!-- Card 1: Camera RAW -->
    <g transform="translate(-370, 0)">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="#0f172a" stroke="#475569" stroke-width="1.2" opacity="0.95" />
      <text y="6" fill="#f8fafc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ Multi-Brand RAW</text>
    </g>

    <!-- Card 2: DNG Specification -->
    <g transform="translate(-125, 0)">
      <rect x="-105" y="-22" width="210" height="44" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" opacity="0.95" />
      <text y="6" fill="#38bdf8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">🌐 Universal DNG Standard</text>
    </g>

    <!-- Card 3: Open-Source Foundations -->
    <g transform="translate(125, 0)">
      <rect x="-105" y="-22" width="210" height="44" rx="22" fill="#0f172a" stroke="#818cf8" stroke-width="1.4" opacity="0.95" />
      <text y="6" fill="#818cf8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">🛠️ LibRaw &amp; darktable</text>
    </g>

    <!-- Card 4: Commercial Powerhouses -->
    <g transform="translate(370, 0)">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
      <text y="6" fill="#c084fc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">✨ AI Optical Denoise</text>
    </g>
  </g>

  <!-- Bottom Tagline / Status Indicator -->
  <g transform="translate(600, 350)" text-anchor="middle">
    <circle cx="-160" cy="-4" r="5" fill="#10b981" />
    <text y="1" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">
      Continuously Updated • Tested Tools &amp; Libraries • Non-Destructive Digital Imaging
    </text>
  </g>
</svg>
